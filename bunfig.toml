[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Critical packages target ≥90% branch coverage once they have implementation.
# Root bootstrap threshold stays low so empty entrypoints do not fail CI yet.
coverageThreshold = { lines = 0.0, functions = 0.0, statements = 0.0 }
coveragePathIgnorePatterns = [
  "**/migrations/**",
  "**/fixtures/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.integration.test.ts",
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**"
]
